name: Build Eleventy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          # The repo has no deploy keys registered, so ACTIONS_DEPLOY_KEY could
          # not authenticate. GITHUB_TOKEN is issued per-run and needs no key
          # management.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
